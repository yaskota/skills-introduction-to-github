<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Hunter Assistant</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --border: #2a2f3a; --text: #e8eaed;
    --muted: #9aa1ac; --accent: #4f8cff; --accent-2: #35c98f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 60px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  p.subtitle { color: var(--muted); margin-top: 0; }
  form {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; display: grid; gap: 14px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
  label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 6px; }
  input[type=text], input[type=number], input[type=file] {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: #10131a; color: var(--text); font-size: 0.95rem;
  }
  button {
    padding: 12px 16px; border-radius: 8px; border: none; background: var(--accent);
    color: white; font-size: 1rem; cursor: pointer; font-weight: 600;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  #status { color: var(--muted); margin: 14px 0; min-height: 1.2em; }
  .job-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .job-card h3 { margin: 0 0 4px; font-size: 1.05rem; }
  .job-card a { color: var(--accent); text-decoration: none; }
  .job-meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 6px; }
  .score-badge {
    display: inline-block; background: var(--accent-2); color: #06231a;
    font-weight: 700; font-size: 0.8rem; padding: 2px 8px; border-radius: 999px;
  }
  .skills { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
  .assist-links { margin-top: 24px; padding: 14px 16px; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; }
  .assist-links a { color: var(--accent); margin-right: 14px; }
  #results { margin-top: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Job Hunter Assistant</h1>
  <p class="subtitle">Upload your resume, describe the role you want, and get live-ranked job matches.</p>

  <form id="search-form">
    <div>
      <label for="resume">Resume (PDF, DOCX or TXT)</label>
      <input type="file" id="resume" name="resume" accept=".pdf,.docx,.txt" required>
    </div>
    <div class="row">
      <div>
        <label for="job_role">Job role / keywords (comma-separated)</label>
        <input type="text" id="job_role" name="job_role" placeholder="python developer, backend engineer" required>
      </div>
      <div>
        <label for="location">Location</label>
        <input type="text" id="location" name="location" placeholder="Bangalore, India">
      </div>
    </div>
    <div class="row">
      <div>
        <label for="companies">Target companies (optional, comma-separated)</label>
        <input type="text" id="companies" name="companies" placeholder="stripe, airbnb">
      </div>
      <div>
        <label for="company_type">Company type (optional)</label>
        <input type="text" id="company_type" name="company_type" placeholder="startup, remote, product-based">
      </div>
    </div>
    <div class="row">
      <div>
        <label for="count">How many results?</label>
        <input type="number" id="count" name="count" value="20" min="1" max="100">
      </div>
      <div>
        <label for="min_score">Minimum match strictness (0-1)</label>
        <input type="number" id="min_score" name="min_score" value="0.05" min="0" max="1" step="0.05">
      </div>
    </div>
    <button type="submit" id="submit-btn">Find matching jobs</button>
  </form>

  <div id="status"></div>
  <div id="results"></div>
</div>

<script>
const form = document.getElementById('search-form');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const submitBtn = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  statusEl.textContent = 'Searching live job feeds and scoring against your resume...';
  resultsEl.innerHTML = '';
  submitBtn.disabled = true;

  try {
    const formData = new FormData(form);
    const resp = await fetch('/api/search', { method: 'POST', body: formData });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || `Request failed (${resp.status})`);
    }
    const data = await resp.json();
    renderResults(data);
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
  } finally {
    submitBtn.disabled = false;
  }
});

function renderResults(data) {
  statusEl.textContent = `Found ${data.results_count} matching job(s). ` +
    `Detected ${data.resume_skills.length} skills in your resume.`;

  let html = '';
  for (const job of data.results) {
    html += `
      <div class="job-card">
        <h3><a href="${job.url}" target="_blank" rel="noopener">${escapeHtml(job.title)}</a></h3>
        <div class="job-meta">${escapeHtml(job.company)} · ${escapeHtml(job.location || 'N/A')} · via ${job.source}</div>
        <span class="score-badge">${job.score_pct}% match</span>
        ${job.matched_skills.length ? `<div class="skills">Matched: ${job.matched_skills.join(', ')}</div>` : ''}
      </div>`;
  }

  if (data.assist_links) {
    html += `<div class="assist-links">
      <strong>LinkedIn / Naukri / Unstop</strong> (open manually, not auto-applied):<br><br>
      <a href="${data.assist_links.linkedin}" target="_blank" rel="noopener">LinkedIn search</a>
      <a href="${data.assist_links.naukri}" target="_blank" rel="noopener">Naukri search</a>
      <a href="${data.assist_links.unstop}" target="_blank" rel="noopener">Unstop search</a>
    </div>`;
  }

  if (data.source_errors && data.source_errors.length) {
    html += `<div class="job-meta" style="margin-top:12px">Some sources were unreachable and were skipped: ${data.source_errors.map(escapeHtml).join(' | ')}</div>`;
  }

  resultsEl.innerHTML = html || '<p style="color:var(--muted)">No matches found - try broader keywords or a lower match strictness.</p>';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
